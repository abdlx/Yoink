services:
  still:
    build: .
    image: still-ytdlp:local
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    env_file: .env
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env first}
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
    volumes:
      - ./data:/data
      - ${DOWNLOAD_PATH:-./downloads}:/downloads
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
