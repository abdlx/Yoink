name: Verify Still
on: [push, pull_request]

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      APP_PASSWORD: still-browser-test-password
      DATA_DIR: /tmp/still-ci/data
      DOWNLOAD_DIR: /tmp/still-ci/downloads
      UPDATE_YTDLP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m pytest -q
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start test server
        run: |
          uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8080 > /tmp/still-ci-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/still-ci-server.log
          exit 1
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: still-ytdlp:ci
      - name: Check container startup and authentication
        run: |
          docker run -d --name still-ci -p 127.0.0.1:8081:8080 \
            -e APP_PASSWORD=still-container-test-password -e UPDATE_YTDLP=false still-ytdlp:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8081/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/jobs)" = "401"
          curl --fail -c /tmp/still-cookies -H 'Content-Type: application/json' \
            -d '{"password":"still-container-test-password"}' http://127.0.0.1:8081/api/login
          curl --fail -b /tmp/still-cookies http://127.0.0.1:8081/api/system
          docker exec still-ci python -c "from pathlib import Path; s=Path('/proc/1/status').read_text(); uid=next(line.split()[1] for line in s.splitlines() if line.startswith('Uid:')); assert uid == '1000', uid"
      - name: Container logs
        if: always()
        run: docker logs still-ci || true
